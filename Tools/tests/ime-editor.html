<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>azooKey IME browser test</title>
<style>
  body { font: 20px system-ui; max-width: 960px; margin: 48px auto; padding: 24px; }
  textarea { box-sizing: border-box; width: 100%; height: 240px; font: 24px system-ui; }
  output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 24px; }
</style>
<h1>azooKey IME browser test</h1>
<p>Type a Japanese sentence, select a tree candidate, then type another character.
   This page runs locally and does not send or store text.</p>
<label for="editor">Test document</label>
<textarea id="editor" autofocus></textarea>
<output id="state" aria-live="polite">Ready</output>
<script>
  const editor = document.querySelector('#editor');
  const state = document.querySelector('#state');
  let composing = false;
  function show() {
    state.textContent = `Composing: ${composing}\nFocused: ${document.activeElement === editor}\nText: ${editor.value}`;
  }
  editor.addEventListener('compositionstart', () => { composing = true; show(); });
  editor.addEventListener('compositionend', () => { composing = false; show(); });
  for (const event of ['input', 'focus', 'blur']) editor.addEventListener(event, show);
</script>
</html>
