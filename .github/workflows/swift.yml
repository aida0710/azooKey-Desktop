name: Swift Build and Test
on:
  push:
  pull_request:

# Keep PR merge-commit checks separate from later push events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-checks:
    runs-on: ${{ (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) && 'r540-linux' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.decision.outputs.result }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/checkout@v4
      - run: node --test Tools/tests/ci-should-run-checks.test.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: decision
        with:
          script: |
            const { shouldRunChecks } = require('./Tools/ci/should-run-checks.cjs');
            return await shouldRunChecks({ github, context, warning: core.warning, info: core.info });

  macos-build:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    name: Build and Test on macOS
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.3
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.3*.app | head -n 1)
          echo "Using Xcode at $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  ubuntu-build:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    name: Build and Test on Ubuntu
    # Ubuntu 22.04向けSwiftの依存ライブラリとsudoが必要なためGitHub側に残す。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  xcodebuild-test:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    name: Xcodebuild test on macOS
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.3
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.3*.app | head -n 1)
          echo "Using Xcode at $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify xcodebuild installation
        run: xcodebuild -version
      - name: List available schemes
        run: xcodebuild -project azooKeyMac.xcodeproj -list
      - name: Test building azooKeyMac (Release configuration)
        run: |
         xcodebuild \
          -project azooKeyMac.xcodeproj \
          -scheme azooKeyMac \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

  swiftlint:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SwiftLint
        run: |
          brew update
          brew install swiftlint
      - name: Check SwiftLint version
        run: swiftlint version
      - name: Run SwiftLint
        run: |
          swiftlint --quiet --strict
  
