name: Diagnose macOS reconversion termination
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record the unchanged production and test source
        run: |
          set -euo pipefail
          mkdir -p build/reconversion-diagnostic
          {
            git rev-parse HEAD
            git diff --exit-code 173f75a9e61fbdd5abf241ee9dbbf817d56b6626 HEAD -- \
              Core azooKeyMac azooKeyMacTests Tools/test-macos-app.sh Tools/diagnose-macos-test.sh
            git rev-parse HEAD:Core HEAD:azooKeyMac HEAD:azooKeyMacTests
            sw_vers
            xcodebuild -version
            xcrun swift --version
            xcrun lldb --version
          } | tee build/reconversion-diagnostic/source-and-sdk.log
      - name: Build the original Metal test bundle once
        run: bash Tools/test-macos-app.sh build --build-tests --jobs 4
      - name: Compare the isolated case and the original suite in separate processes
        run: bash Tools/diagnose-reconversion-tests.sh
      - name: Preserve both debugger observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-reconversion-diagnostic
          path: build/reconversion-diagnostic
          if-no-files-found: error
          retention-days: 7
