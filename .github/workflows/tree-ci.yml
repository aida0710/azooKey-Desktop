name: Temporary IMK client diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imk-client-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare public IMK client initialization paths
        run: python3 Tools/diagnostics/imk-client/run.py
      - name: Preserve each isolated outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imk-client-diagnosis
          path: build/imk-client-diagnosis
          if-no-files-found: error
