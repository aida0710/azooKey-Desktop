name: Compare native marked text selection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the SDK before observing both revisions
        run: |
          set -euo pipefail
          mkdir -p build/marked-selection-comparison
          {
            git rev-parse HEAD
            sw_vers
            xcodebuild -version
            xcrun swift --version
            shasum -a 256 Tools/diagnostics/compare-marked-selection.py
          } | tee build/marked-selection-comparison/source-and-sdk.log
      - name: Compare the same regressions and preserve the original failures
        run: >-
          python3 Tools/diagnostics/compare-marked-selection.py
          --before 97ed2ae44f38746ca890a4b5fa174026619d558c
          --after b78d4ea61e887a60d074dd002afea1796b4a05db
      - name: Preserve both outcomes including unexpected failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marked-selection-comparison
          path: build/marked-selection-comparison
          if-no-files-found: error
          retention-days: 7
