name: Tree and platform tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A push must not cancel the PR's merge-commit validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.decision.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test Tools/tests/ci-should-run-checks.test.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: decision
        with:
          script: |
            const { shouldRunChecks } = require('./Tools/ci/should-run-checks.cjs');
            return await shouldRunChecks({ github, context, warning: core.warning, info: core.info });
  ubuntu:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash Tools/test-docker.sh
      - name: Fetch pinned model pointers without LFS installation
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git submodule update --init
      - run: python3 Tools/fetch-models.py
      - run: bash Tools/test-docker.sh --zenzai
      - name: Preserve native toolkit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-toolkit-${{ matrix.runner }}
          path: build/test-artifacts
          if-no-files-found: ignore
          retention-days: 7
  macos:
    needs: select-checks
    if: needs.select-checks.outputs.run-checks == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash Tools/tests/test-sync-upstream.sh
      - run: bash Tools/tests/test-docker-preflight.sh
      - run: bash Tools/test-tree-model.sh
      - run: swift test --package-path Core
      - run: bash Tools/test-macos-app.sh test --jobs 4
      - run: AZOOKEY_INFERENCE_BACKEND=cpu bash Tools/test-macos-app.sh test --jobs 4
      - name: Diagnose a macOS test-process crash
        if: failure()
        run: bash Tools/diagnose-macos-test.sh
