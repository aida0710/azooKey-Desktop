name: Diagnose consecutive macOS input tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run consecutive input tests with the unchanged fixture
        run: bash Tools/test-macos-app.sh test --filter AISuggestionInputTests --jobs 4
      - name: Capture the failing test sequence under LLDB
        if: failure()
        run: bash Tools/diagnose-macos-test.sh
