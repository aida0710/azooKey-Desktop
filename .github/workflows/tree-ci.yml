name: Observe native marked text selection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record unchanged application source and the native SDK
        run: |
          set -euo pipefail
          mkdir -p build/nstextview-selection
          {
            git rev-parse HEAD
            git diff --exit-code 173f75a9e61fbdd5abf241ee9dbbf817d56b6626 HEAD -- Core azooKeyMac azooKeyMacTests
            shasum -a 256 Tools/diagnostics/nstextview-selection.swift
            sw_vers
            xcodebuild -version
            xcrun swift --version
          } | tee build/nstextview-selection/source-and-sdk.log
      - name: Observe seven cases in separate native processes
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json
          import subprocess
          directory = Path("build/nstextview-selection")
          observations = []
          for scenario in (
              "sentinel-both", "sentinel-location", "preview-then-clear",
              "commit-then-empty", "selected-range", "unicode-range", "sentinel-at-zero",
          ):
              with (directory / f"{scenario}.log").open("w") as output:
                  completed = subprocess.run(
                      ["xcrun", "swift", "Tools/diagnostics/nstextview-selection.swift", scenario],
                      stdout=output, stderr=subprocess.STDOUT,
                  )
              observation = {"scenario": scenario, "exitCode": completed.returncode}
              observations.append(observation)
              print(json.dumps(observation), flush=True)
          (directory / "summary.json").write_text(json.dumps(observations, indent=2) + "\n")
          raise SystemExit(0 if all(item["exitCode"] == 0 for item in observations) else 1)
          PYTHON
      - name: Preserve all native observations including failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nstextview-selection
          path: build/nstextview-selection
          if-no-files-found: error
          retention-days: 7
